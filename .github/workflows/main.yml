# .github/workflows/main.yml
name: CI/CD - Sunflower Ecommerce AWS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sunflower-app
  APP_CONTAINER_NAME: 'sunflower_web_app'

jobs:
  # 🧪 1. Compilar el JAR usando los servidores de GitHub
  test-and-build:
    name: 🧪 Test & Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build JAR
        run: mvn clean package -DskipTests

      - name: 📦 Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # 🐳 2. Construir la imagen Docker y subirla a tu Amazon ECR privado
  docker-build-push:
    name: 🐳 Docker Build & Push ECR
    runs-on: ubuntu-latest
    needs: test-and-build
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: 🔐 Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Build y Push imagen Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # 🚀 3. Conectarse vía SSH a tu EC2 de AWS e iniciar el contenedor
  deploy:
    name: 🚀 Deploy en AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: 🚀 Deploy en EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Instalar Docker en tu servidor de AWS si no existe
            if ! command -v docker &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y docker.io
              sudo usermod -aG docker ubuntu
            fi

            # Configurar las credenciales temporales completas dentro de la EC2
            REGISTRY_DOMAIN=$(echo "${{ needs.docker-build-push.outputs.image }}" | cut -d'/' -f1)
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set aws_session_token ${{ secrets.AWS_SESSION_TOKEN }}
            aws configure set region ${{ env.AWS_REGION }}
            
            # Autenticarse contra Amazon ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY_DOMAIN

            # Detener y limpiar contenedores anteriores si existen
            docker rm -f ${{ env.APP_CONTAINER_NAME }} || true

            # Desplegar el nuevo contenedor Docker de Sunflower
            docker run -d --name ${{ env.APP_CONTAINER_NAME }} -p 8081:8081 ${{ needs.docker-build-push.outputs.image }}
            echo "✅ ¡Proyecto Sunflower en vivo en AWS!"
