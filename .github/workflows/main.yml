# .github/workflows/main.yml
name: CI/CD - Sunflower Docker Deploy AWS (Optimizado para Disco)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_PROJECT_NAME: 'sunflowerapp'
  APP_CONTAINER_NAME: 'sunflower_web_app'
  DB_CONTAINER_NAME: 'sunflower_db_mysql'
  DB_NAME: 'ecommerce_db'
  DB_USER: 'root'
  DB_PASSWORD: 'benja'

jobs:
  # 🧪 TRABAJO 1: Compila el JAR usando los servidores GRATUITOS de GitHub
  build-jar:
    name: 🔨 Compilar JAR en GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        run: mvn -B clean package -DskipTests

      - name: 📦 Guardar JAR como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # 🐳 TRABAJO 2: Levanta Docker directo en tu EC2 consumiendo el JAR
  deploy-aws:
    name: 🚀 Desplegar en AWS EC2
    runs-on: self-hosted
    needs: build-jar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Descargar JAR ya listo
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          echo "🔄 Iniciando despliegue optimizado en AWS..."
          
          cd docker
          
          echo "🧹 Limpieza preventiva de imágenes viejas para ganar espacio..."
          sudo docker compose -p ${DOCKER_PROJECT_NAME} down -v --remove-orphans || true
          sudo docker image prune -f || true
          
          echo "🏗️ Construyendo imágenes sin usar caché vieja..."
          sudo docker compose -p ${DOCKER_PROJECT_NAME} build --no-cache
          
          echo "🚀 Levantando servicios en segundo plano..."
          sudo docker compose -p ${DOCKER_PROJECT_NAME} up -d
          
          echo "⏳ Esperando 30 segundos para la Base de Datos..."
          sleep 30
          
          if [ -f "../sql/init.sql" ]; then
            echo "🗄️ Cargando la estructura SQL local..."
            sudo cat ../sql/init.sql | sudo docker exec -i ${DB_CONTAINER_NAME} mysql -u${DB_USER} -p${DB_PASSWORD} ${DB_NAME} || true
          fi
          
          echo "📊 Verificando estado de los servicios:"
          sudo docker compose -p ${DOCKER_PROJECT_NAME} ps
          
          echo "📝 Logs finales:"
          sudo docker logs --tail 50 ${APP_CONTAINER_NAME}
          
          echo "✅ ¡Despliegue completado con éxito sin saturar el disco!"
