# .github/workflows/main.yml
# Pipeline CI/CD: Docker Deploy en AWS EC2 mediante Self-Hosted Runner (Sin SonarQube)

name: CI/CD - Sunflower Docker Deploy AWS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_PROJECT_NAME: 'sunflowerapp'
  APP_CONTAINER_NAME: 'sunflower_web_app'
  DB_CONTAINER_NAME: 'sunflower_db_mysql'
  DB_NAME: 'ecommerce_db'
  DB_USER: 'root'
  DB_PASSWORD: 'benja'

jobs:
  # 🐳 UNICO JOB: Compilación y Despliegue directo en la EC2 de AWS
  build-and-deploy:
    name: Build and Docker Deploy on AWS
    runs-on: self-hosted       # Esto hará que corra dentro de tu servidor EC2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        run: mvn -B clean package -DskipTests

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          echo "🔄 Iniciando despliegue automatizado en el servidor de AWS..."
          
          # Instalar Docker en la EC2 automáticamente si no existiera
          if ! command -v docker &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y docker.io docker-compose
            sudo usermod -aG docker ubuntu
          fi
          
          cd docker
          
          echo "🧹 Limpiando despliegue anterior en la nube..."
          sudo docker-compose -p ${DOCKER_PROJECT_NAME} down -v --remove-orphans || true
          
          echo "🏗️ Construyendo y levantando contenedores en AWS..."
          sudo docker-compose -p ${DOCKER_PROJECT_NAME} up -d --build
          
          echo "⏳ Esperando 30 segundos para la Base de Datos..."
          sleep 30
          
          if [ -f "../sql/init.sql" ]; then
            echo "🗄️ Cargando la estructura SQL local en la base de datos de AWS..."
            sudo cat ../sql/init.sql | sudo docker exec -i ${DB_CONTAINER_NAME} mysql -u${DB_USER} -p${DB_PASSWORD} ${DB_NAME} || true
          fi
          
          echo "📊 Verificando estado de los servicios:"
          sudo docker-compose -p ${DOCKER_PROJECT_NAME} ps
          
          echo "📝 Logs finales de Spring Boot:"
          sudo docker logs --tail 50 ${APP_CONTAINER_NAME}
          
          echo "✅ ¡Proyecto Sunflower desplegado con éxito en internet!"
