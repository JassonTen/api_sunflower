# .github/workflows/main.yml
# Pipeline CI/CD local: Test, Build y Docker Deploy en Ubuntu Server (VirtualBox)

name: CI/CD - Sunflower Ecommerce Local

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_PROJECT_NAME: 'sunflowerapp'
  APP_CONTAINER_NAME: 'sunflower_web_app'
  DB_CONTAINER_NAME: 'sunflower_db_mysql'

jobs:
  # 🧪 JOB 1: Compilación y Pruebas del Proyecto
  build-and-test:
    name: 🧪 Test & Build JAR
    runs-on: self-hosted  # 🎯 Cambiado para ejecutarse directamente en tu VirtualBox
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🧪 Ejecutar compilación y pruebas locales
        run: mvn clean package

      - name: 📦 Guardar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # 🐳 JOB 2: Construcción y Despliegue con Docker Compose en tu Servidor Local
  deploy-local:
    name: 🚀 Docker Deploy (VirtualBox)
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Descargar JAR compilado
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: 🚀 Orquestar Entorno con Docker Compose
        shell: bash
        run: |
          echo "🔄 Iniciando despliegue en el runner local..."
          
          # Entramos a la carpeta donde Arly guardó las configuraciones de docker
          cd docker
          
          echo "🧹 Limpiando contenedores previos..."
          docker-compose -p ${DOCKER_PROJECT_NAME} down -v --remove-orphans || true
          
          echo "🏗️ Construyendo imágenes y levantando servicios locales..."
          docker-compose -p ${DOCKER_PROJECT_NAME} up -d --build
          
          echo "⏳ Esperando 20 segundos a que la base de datos esté lista..."
          sleep 20
          
          # Si tu proyecto cuenta con un archivo init.sql para la base de datos, lo cargamos aquí
          if [ -f "../sql/init.sql" ]; then
            echo "🗄️ Inicializando base de datos desde init.sql..."
            cat ../sql/init.sql | docker exec -i ${DB_CONTAINER_NAME} mysql -u root -pbenja ecommerce_db || true
          fi
          
          echo "📊 Estado actual de los contenedores:"
          docker-compose -p ${DOCKER_PROJECT_NAME} ps
          
          echo "📝 Últimos logs de la aplicación Spring Boot:"
          docker logs --tail 50 ${APP_CONTAINER_NAME}
